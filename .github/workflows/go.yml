name: Go

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.24.x' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Build
        run: make build
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1.6
      - name: Test with the Go CLI
        run: make test
